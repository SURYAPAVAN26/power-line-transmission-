# ============================================================
# docker-compose.yml — Insulator Defect Detection System
# Services: api (FastAPI/uvicorn) + frontend (nginx)
# ============================================================

version: "3.9"

services:

  # ── FastAPI Inference API ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: insulator-defect-api:latest
    container_name: insulator-api
    restart: unless-stopped
    environment:
      - MODEL_PATH=/app/models/best.pt
      - PYTHONUNBUFFERED=1
    volumes:
      - models_data:/app/models:ro      # read-only model weights
    ports:
      - "8000:8000"                     # direct access for dev
    networks:
      - insulator_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ── React Frontend (nginx) ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: insulator-defect-frontend:latest
    container_name: insulator-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - insulator_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Volumes ───────────────────────────────────────────────────
volumes:
  models_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./models        # bind-mount local models/ directory

# ── Networks ──────────────────────────────────────────────────
networks:
  insulator_net:
    driver: bridge
    name: insulator_net
