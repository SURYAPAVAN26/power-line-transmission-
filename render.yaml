services:
  - type: web
    name: insulator-defect-detector-api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: models/best.pt
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: LOG_LEVEL
        value: info
      # If your model weights (best.pt) are hosted online (HuggingFace / GitHub Releases / S3),
      # uncomment and set MODEL_URL so Render downloads it on boot:
      # - key: MODEL_URL
      #   value: https://huggingface.co/username/repo/resolve/main/best.pt
